[project]
name = "orca-base-backend"
version = "0.1.0"
description = "Beginner-friendly FastAPI foundation for ORCA"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "geoalchemy2>=0.17",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

