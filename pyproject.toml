[project]
name = "orca-base-backend"
version = "0.1.0"
description = "Beginner-friendly FastAPI foundation for ORCA"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
copernicus = [
  "copernicusmarine==2.4.1",
]
ecmwf = [
  "ecmwf-opendata==0.3.34",
  "eccodes==2.48.0",
]
redis = [
  "redis>=5.2",
]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

