services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ORCA Base API
      - APP_ENV=production
      - API_PREFIX=/v1
      - CORS_ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - ASSISTANT_ENABLED=true
      - ASSISTANT_GEMINI_ROUTING_ENABLED=true
      - ASSISTANT_MODEL=gemini-3.7-flash
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend_candidate
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ORCA_API_BASE_URL=http://localhost:8000
        - NEXT_PUBLIC_MAP_STYLE_URL=https://tiles.openfreemap.org/styles/liberty
        - NEXT_PUBLIC_ORCA_ASSISTANT_MODE=live
        - NEXT_PUBLIC_ORCA_DEMO_MODE=false
        - NEXT_PUBLIC_ORCA_PRESENTATION_MODE=false
    container_name: orca-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: orca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
